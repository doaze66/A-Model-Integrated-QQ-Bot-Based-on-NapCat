# QQ AI 替身 - 配置文件
# 运行前请按需修改（红色标注处必须填自己的）

# 运行模式:
#   listen - 只监听消息并记录日志，绝不回复（最安全，用于观察）
#   draft  - AI 生成草稿写入 replies.txt，不自动发送（半自动人工确认）
#   auto   - 白名单内的会话自动回复，其他只记录
mode: auto

# NapCat OneBot WebSocket 地址（默认 127.0.0.1:3001）
ws_url: ws://127.0.0.1:3001

# 机器人身份（⚠️ 改成你自己的 QQ 号）
bot_qq: 0
bot_name: 机器人

# 人设（AI 回复时的身份和语气）
persona: |
  你是对方的 QQ 好友，是对方的朋友。
  风格特点：
  - 自然友好：语气亲切随和，像身边熟悉的朋友，不端着也不生硬
  - 有分寸：平时可以轻松调侃，但对方认真时立刻认真，不开过火的玩笑
  - 贴心：对方说累、说烦、说心情不好时，先关心安抚，再给建议
  - 有幽默感：偶尔接梗、吐槽两句，让聊天轻松好玩，但不挖苦不损人
  - 回应及时：消息发来认真看，不敷衍，不用"嗯嗯""哦哦"打发人
  原则：
  - 永远不要暴露自己是 AI 或机器人
  - 绝对不要用括号描述动作、表情或心理活动（如"（歪头）""（笑）""（探头）"），像真人打字聊天一样直接说话
  - 回复简短自然，符合 QQ 聊天习惯，1-3 句为主
  - 跟随对方情绪：对方认真你认真，对方开玩笑你就陪他闹
# 白名单：只对这些群/人自动回复（auto 模式下生效）
# 群 ID 和 QQ 号留空数组表示不自动回复任何会话
# ⚠️ 改成你自己的群/好友 QQ 号
whitelist:
  groups: []      # 例: [123456789]
  users: []       # 例: [123456789]

# 敏感词：命中则绝不回复，并记录告警
block_words:
  - 转账
  - 付款
  - 密码
  - 验证码
  - 银行卡
  - 身份证
  - 借钱
  - 红包
  - 验证身份

# 指令开关：对方发送这些词可以临时暂停/恢复 AI
pause_words: [暂停, stop, 停一下]
resume_words: [恢复, 继续, resume]

# 频率限制（防止刷屏和风控）
rate_limit:
  min_interval_sec: 0     # 同一会话两次回复的最小间隔
  max_replies_per_min: 0   # 每分钟最多回复条数（全局）

# 回复长度限制
max_reply_len: 300

# 上下文记忆：每个会话保留最近多少条消息
context_window: 20

# LLM 后端:
#   echo    - 打桩测试，原样回显（不接 AI，用于验证消息链路）
#   ollama  - 本地模型（需安装 Ollama: https://ollama.com）
#   openai  - 云端 OpenAI 兼容 API（DeepSeek/通义/OpenAI 等）
llm:
  backend: openai
  model: qwen2.5:7b           # ollama 模型名
  ollama_url: http://127.0.0.1:11434
  api_base: https://api.deepseek.com/v1
  api_key: ""                 # 改成你自己的 API Key
  api_model: deepseek-chat
  temperature: 0.9
